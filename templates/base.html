{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <title>{% block title %}Django Shop{% endblock %}</title>
 <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
 <header class="site-header">
 <a href="{% url 'store:product_list' %}" class="logo">Django Shop</a>
 <nav>
 <a href="{% url 'store:product_list' %}">All products</a>
 <span class="muted">Cart (Day 3)</span>
 </nav>
 </header>
 <main class="container">
 {% block content %}{% endblock %}
 </main>
 <footer class="site-footer">Built with Django &middot; Day 2</footer>
</body>
</html>
